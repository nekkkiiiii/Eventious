<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Eventious</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="auth-page">
  <div class="auth-card">
    <div class="brand auth-brand">
      <span class="logo">E</span>
      <span>Eventious</span>
    </div>
    <h1 id="authTitle">Welcome back</h1>
    <p class="muted" id="authSub">Log in to manage your events.</p>

    <div class="alert hidden" id="authError" role="alert"></div>

    <form id="authForm" novalidate>
      <label id="nameField" class="hidden">Full name
        <input type="text" id="name" autocomplete="name" placeholder="Juan Dela Cruz" />
      </label>
      <label>Email
        <input type="email" id="email" autocomplete="email" required placeholder="you@example.com" />
      </label>
      <label>Password
        <input type="password" id="password" autocomplete="current-password" required minlength="8" placeholder="At least 8 characters" />
      </label>
      <button type="submit" class="btn primary block" id="submitBtn">Log in</button>
    </form>

    <p class="auth-switch">
      <span id="switchText">Don't have an account?</span>
      <button type="button" class="link-btn" id="switchBtn">Create one</button>
    </p>
  </div>

  <script>
    let mode = "login";
    const $ = (s) => document.querySelector(s);

    function setMode(m) {
      mode = m;
      const reg = m === "register";
      $("#authTitle").textContent = reg ? "Create your account" : "Welcome back";
      $("#authSub").textContent = reg ? "Start organizing your events in minutes." : "Log in to manage your events.";
      $("#submitBtn").textContent = reg ? "Create account" : "Log in";
      $("#switchText").textContent = reg ? "Already have an account?" : "Don't have an account?";
      $("#switchBtn").textContent = reg ? "Log in" : "Create one";
      $("#nameField").classList.toggle("hidden", !reg);
      $("#password").autocomplete = reg ? "new-password" : "current-password";
      $("#authError").classList.add("hidden");
    }

    $("#switchBtn").addEventListener("click", () => setMode(mode === "login" ? "register" : "login"));

    $("#authForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = $("#submitBtn");
      const err = $("#authError");
      err.classList.add("hidden");
      btn.disabled = true;

      const body = { email: $("#email").value, password: $("#password").value };
      if (mode === "register") body.name = $("#name").value;

      try {
        const res = await fetch(`/api/${mode}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data.error || "Something went wrong.");
        window.location.href = "/";
      } catch (ex) {
        err.textContent = ex.message === "Failed to fetch" ? "Can't reach the server. Is it running?" : ex.message;
        err.classList.remove("hidden");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
